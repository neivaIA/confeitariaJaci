<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jaci Doces &amp; Bolos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pr:#9b1b5a;--prl:#b52268;--prd:#7a1447;--ac:#d4547a;
  --bg:#fff8fb;--bg2:#fceef5;--sur:#fff;
  --bd:#eeccd9;--bd2:#f5dce8;
  --tx:#3a0a20;--tx2:#6b2040;--tx3:#9a5070;--tx4:#c490a8;
  --ok:#16a34a;--okb:#dcfce7;--wn:#d97706;--wnb:#fef3c7;
  --inf:#2563eb;--infb:#dbeafe;--gr:#6b7280;--grb:#f3f4f6;--dn:#dc2626;
  --gold:#f5c518;--gold2:#e8a800
}
html{font-size:15px}
body{font-family:'Inter',sans-serif;background:#fff8fb;color:var(--tx);min-height:100vh}
button,input,select,textarea{font-family:'Inter',sans-serif}
a{text-decoration:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--ac);border-radius:8px}

#login-screen{display:flex;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#4a0825 0%,#9b1b5a 50%,#d4547a 100%);position:fixed;inset:0;z-index:1000}
#login-screen.hidden{display:none}
.lcard{background:#fff;border-radius:24px;padding:48px 44px;width:100%;max-width:420px;box-shadow:0 32px 80px rgba(155,27,90,.4);text-align:center;position:relative;overflow:hidden}
.lcard .lico{font-size:52px;display:block;margin-bottom:16px}
.lcard h2{font-family:'Playfair Display',serif;font-size:28px;color:var(--tx);margin-bottom:6px}
.lcard .lsub{color:var(--tx3);font-size:14px;margin-bottom:32px}
.lform{text-align:left;display:flex;flex-direction:column;gap:14px}
.lerr{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:9px;padding:10px 14px;font-size:13px;display:none}
.lerr.show{display:block}
.lfoot{margin-top:20px;font-size:12px;color:var(--tx4)}

#app{display:flex;min-height:100vh;background:#fff8fb}
.sidebar{width:240px;background:linear-gradient(180deg,#7a1447 0%,#9b1b5a 40%,#b52268 100%);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:200;transition:transform .3s}
.slogo{padding:28px 24px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.slogo .sico{font-size:28px;display:block;margin-bottom:8px}
.slogo h1{font-family:'Playfair Display',serif;color:#fff;font-size:18px;font-weight:600;line-height:1.2}
.slogo p{color:rgba(255,255,255,.4);font-size:11px;margin-top:2px}
.snav{flex:1;padding:16px 12px;overflow-y:auto}
.nsec{color:rgba(255,255,255,.3);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px 4px;margin-top:8px}
.ni{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.55);font-size:13.5px;font-weight:500;width:100%;background:none;border:none;text-align:left;margin-bottom:2px;transition:all .18s;cursor:pointer}
.ni:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.ni.active{background:var(--prl);color:#fff;font-weight:600}
.ni svg{width:18px;height:18px;flex-shrink:0}
.sfooter{padding:16px 12px;border-top:1px solid rgba(255,255,255,.08)}
.boutl{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.45);font-size:13px;background:none;border:none;width:100%;font-weight:500;transition:all .18s;cursor:pointer}
.boutl:hover{background:rgba(220,38,38,.15);color:#fca5a5}

.topbar{display:none;position:fixed;top:0;left:0;right:0;height:56px;background:linear-gradient(135deg,#7a1447,#9b1b5a);z-index:150;align-items:center;padding:0 16px;gap:12px}
.topbar h2{font-family:'Playfair Display',serif;color:#fff;font-size:16px}
.hmb{background:none;border:none;color:#fff;padding:4px;display:flex;align-items:center;cursor:pointer}
.ovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190}

.main{margin-left:240px;flex:1;min-height:100vh;display:flex;flex-direction:column;background:#fff8fb}
.ph{background:#fff;border-bottom:1px solid var(--bd2);padding:28px 32px 24px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px}
.ph h2{font-family:'Playfair Display',serif;font-size:26px;color:var(--tx);font-weight:600}
.ph p{color:var(--tx3);font-size:13.5px;margin-top:3px}
.pc{padding:28px 32px;flex:1;background:#fff8fb}

.card{background:#fff;border-radius:14px;border:1px solid var(--bd2);box-shadow:0 1px 4px rgba(150,60,20,.08),0 4px 16px rgba(150,60,20,.06);padding:22px}

.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.sc{background:#fff;border-radius:14px;border:1px solid var(--bd2);padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 4px rgba(150,60,20,.08)}
.sc .sic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.sc .slbl{font-size:12px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.sc .sval{font-size:24px;font-weight:700;color:var(--tx);font-family:'Playfair Display',serif}
.sc .ssub{font-size:12px;color:var(--tx4)}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:10px;font-size:13.5px;font-weight:600;border:none;cursor:pointer;transition:all .18s}
.bpr{background:linear-gradient(135deg,var(--pr),var(--prl));color:#fff}
.bpr:hover{background:var(--prd);transform:translateY(-1px);box-shadow:0 4px 12px rgba(155,27,90,.35)}
.bse{background:var(--bg2);color:var(--pr);border:1.5px solid var(--bd)}
.bse:hover{background:#eeddd4}
.bgh{background:none;color:var(--tx3);border:1.5px solid var(--bd)}
.bgh:hover{background:var(--bg2);color:var(--tx2)}
.bdn{background:#fef2f2;color:var(--dn);border:1.5px solid #fecaca}
.bdn:hover{background:#fee2e2}
.bsuc{background:#16a34a;color:#fff}
.bsuc:hover{background:#15803d}
.bsm{padding:6px 12px;font-size:12px;border-radius:8px}
.bic{padding:7px;border-radius:8px}

.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bwn{background:var(--wnb);color:var(--wn)}
.binf{background:var(--infb);color:var(--inf)}
.bok{background:var(--okb);color:var(--ok)}
.bgr{background:var(--grb);color:var(--gr)}
.bpri{background:#fff0eb;color:var(--pr)}

.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:11.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.fi{width:100%;padding:10px 13px;border-radius:9px;border:1.5px solid var(--bd);font-size:13.5px;color:var(--tx);background:var(--bg);outline:none;transition:border-color .18s}
.fi:focus{border-color:var(--prl);background:#fff;box-shadow:0 0 0 3px rgba(196,98,45,.08)}
.fgrid{display:grid;gap:14px}
.fg2{grid-template-columns:1fr 1fr}
.fg3{grid-template-columns:1fr 1fr 1fr}
.cs2{grid-column:span 2}

.mover{display:none;position:fixed;inset:0;background:rgba(20,10,5,.6);z-index:500;align-items:center;justify-content:center;padding:20px}
.mover.open{display:flex}
.mbox{background:#fff;border-radius:20px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(150,60,20,.14);animation:mshow .22s ease}
.mbox.wide{max-width:720px}
@keyframes mshow{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 0}
.mhdr h3{font-family:'Playfair Display',serif;font-size:20px;color:var(--tx)}
.mbdy{padding:20px 26px 26px;display:flex;flex-direction:column;gap:16px}
.bcl{background:var(--bg2);border:none;border-radius:8px;padding:6px 10px;color:var(--tx3);cursor:pointer}
.bcl:hover{background:var(--bd)}

.lc{background:#fff;border-radius:14px;border:1px solid var(--bd2);padding:16px 18px;box-shadow:0 1px 4px rgba(150,60,20,.08);transition:box-shadow .2s;margin-bottom:10px}
.lc:hover{box-shadow:0 4px 20px rgba(150,60,20,.1)}
.lch{display:flex;align-items:flex-start;gap:12px}
.lca{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tchip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;background:#fff0eb;color:var(--pr)}

.rsr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rss{text-align:center;background:var(--bg);border-radius:9px;padding:8px}
.rsl{font-size:10px;color:var(--tx3);font-weight:700;text-transform:uppercase}
.rsv{font-size:14px;font-weight:700;margin-top:2px}

.av{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#9b1b5a,#d4547a);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;flex-shrink:0}
.avsm{width:34px;height:34px;border-radius:9px;font-size:14px}

.empty{text-align:center;padding:56px 24px;color:var(--tx4)}
.empty .ei{font-size:48px;margin-bottom:12px}
.empty h3{font-size:16px;color:var(--tx3);font-weight:600;margin-bottom:6px}
.empty p{font-size:13px}

.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.pill{padding:5px 14px;border-radius:20px;border:1.5px solid var(--bd);font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:var(--tx3);transition:all .15s}
.pill.active{background:var(--pr);color:#fff;border-color:var(--pr)}

.sb{position:relative}
.sb input{padding-left:38px}
.sb .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx4);pointer-events:none}

.ic{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd2);border-radius:9px;padding:9px 12px;margin-bottom:6px}
.icn{font-weight:600;font-size:13px;color:var(--tx);flex:1}
.icd{font-size:11px;color:var(--tx3)}
.ico{font-size:13px;font-weight:700;color:var(--pr);min-width:70px;text-align:right}

.aip{background:var(--bg2);border-radius:12px;padding:14px}
.aipl{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.pvcost{margin-top:8px;background:#fff;border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px}

.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cc{background:#fff;border-radius:9px;padding:9px 10px;text-align:center;border:1px solid var(--bd2)}
.cc.hl{background:var(--pr);border-color:var(--pr)}
.ccl{font-size:10px;color:var(--tx3);font-weight:700;text-transform:uppercase;margin-bottom:3px}
.cc.hl .ccl{color:rgba(255,255,255,.75)}
.ccv{font-size:13px;font-weight:700;color:var(--tx)}
.cc.hl .ccv{color:#fff}

.fbox{background:var(--bg);border:1px solid var(--bd2);border-radius:12px;padding:14px 16px;font-size:13px;line-height:2;color:var(--tx2)}
.ftot{border-top:1px dashed var(--bd);padding-top:8px;margin-top:4px;font-size:16px;font-weight:700;color:var(--pr)}

.opgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opbox{border-radius:11px;padding:13px}
.opgas{background:#fff8f0;border:1.5px solid #fed7aa}
.openergy{background:#eff6ff;border:1.5px solid #bfdbfe}
.oplbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.opgas .oplbl{color:#c2410c}
.openergy .oplbl{color:#1d4ed8}
.ophint{font-size:10.5px;color:var(--tx4);margin-top:5px}

.qi{background:var(--bg);border:1px solid var(--bd2);border-radius:10px;padding:12px;margin-bottom:8px}
.qig{display:grid;grid-template-columns:1fr 60px 110px 36px;gap:8px;align-items:end}

.ibox{background:#fff8f5;border:1.5px solid #fde0cc;border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--tx2);line-height:1.5}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding-top:56px}
  .topbar{display:flex}
  .ovl.open{display:block}
  .ph{padding:20px 16px 16px}
  .pc{padding:20px 16px}
  .fg2{grid-template-columns:1fr}
  .fg3{grid-template-columns:1fr 1fr}
  .cs2{grid-column:span 1}
  .sgrid{grid-template-columns:1fr 1fr}
  .cgrid{grid-template-columns:1fr 1fr}
  .qig{grid-template-columns:1fr 50px auto 36px}
}
@media(max-width:480px){
  .fg3{grid-template-columns:1fr}
  .lcard{padding:36px 24px}
}

</style>
</head>

<script>

// ── SUPABASE ─────────────────────────────────────────────────────────────────
var SB_URL = 'https://wuwsmckijelrlcltjvko.supabase.co';
var SB_KEY = 'sb_publishable_Q6f0dzZlJrfuX9EyfMITGw_RhX3q9QF';

function sbH() {
  return {
    'Content-Type': 'application/json',
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Prefer': 'return=representation'
  };
}
function sbGet(tbl, cb) {
  fetch(SB_URL + '/rest/v1/' + tbl + '?order=id.asc', {method:'GET', headers:sbH()})
    .then(function(r){return r.json();})
    .then(function(d){cb(null, Array.isArray(d)?d:[]);})
    .catch(function(e){cb(e,[]);});
}
function sbInsert(tbl, row, cb) {
  fetch(SB_URL + '/rest/v1/' + tbl, {method:'POST', headers:sbH(), body:JSON.stringify(row)})
    .then(function(r){return r.json();})
    .then(function(d){cb(null, Array.isArray(d)?d[0]:d);})
    .catch(function(e){cb(e,null);});
}
function sbUpdate(tbl, id, row, cb) {
  fetch(SB_URL + '/rest/v1/' + tbl + '?id=eq.' + id, {method:'PATCH', headers:sbH(), body:JSON.stringify(row)})
    .then(function(r){return r.json();})
    .then(function(d){cb(null,d);})
    .catch(function(e){cb(e,null);});
}
function sbDelete(tbl, id, cb) {
  fetch(SB_URL + '/rest/v1/' + tbl + '?id=eq.' + id, {
    method:'DELETE', headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
  }).then(function(){cb(null);}).catch(function(e){cb(e);});
}

var DB = {i:[], r:[], o:[], c:[]};

function showSpinner(msg) {
  var pages = ['home','orders','clients','recipes','ingredients'];
  for (var i=0; i<pages.length; i++) {

}

function loadAllData(cb) {
  var done = 0;
  var errs = [];
  function check(e) {
    if (e) errs.push(e.message||'erro');
    done++;
    if (done === 4) cb(errs.length ? errs[0] : null);
  }
  sbGet('ingredientes', function(e,d){
    if (!e) DB.i = d.map(function(r){return {id:r.id,name:r.name,qty:r.qty,unit:r.unit,price:r.price};});
    check(e);
  });
  sbGet('receitas', function(e,d){
    if (!e) DB.r = d.map(function(r){return {id:r.id,name:r.name,cat:r.cat,srv:r.srv,lh:r.lh,lr:r.lr,pm:r.pm,gas:r.gas,nrg:r.nrg,ings:r.ings||[]};});
    check(e);
  });
  sbGet('pedidos', function(e,d){
    if (!e) DB.o = d.map(function(r){return {id:r.id,client:r.client,phone:r.phone,product:r.product,qty:r.qty,price:r.price,date:r.date,status:r.status,notes:r.notes};});
    check(e);
  });
  sbGet('clientes', function(e,d){
    if (!e) DB.c = d.map(function(r){return {id:r.id,name:r.name,phone:r.phone,email:r.email,bday:r.bday,addr:r.addr,notes:r.notes,tags:r.tags||[]};});
    check(e);
  });
}

function persist(k) {}

function uid() { return Date.now() + Math.floor(Math.random() * 1000000); }

function fmt(v) {
  var n = parseFloat(v) || 0;
  return 'R$ ' + n.toFixed(2).replace('.', ',');
}

function fd(d) {
  if (!d) return '-';
  var parts = d.split('-');
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function numsOnly(s) {
  var r = '';
  var str = String(s || '');
  for (var i = 0; i < str.length; i++) {
    if (str[i] >= '0' && str[i] <= '9') r += str[i];
  }
  return r;
}

function calcR(r) {
  var ingC = 0;
  var ings = r.ings || [];
  for (var i = 0; i < ings.length; i++) {
    var ri = ings[i];
    var ing = null;
    for (var j = 0; j < DB.i.length; j++) {
      if (DB.i[j].id === ri.iid) { ing = DB.i[j]; break; }
    }
    if (ing && ing.qty) ingC += (ing.price / ing.qty) * ri.qty;
  }
  var gas  = parseFloat(r.gas) || 0;
  var nrg  = parseFloat(r.nrg) || 0;
  var lh   = parseFloat(r.lh)  || 0;
  var lr   = parseFloat(r.lr)  || 0;
  var pm   = parseFloat(r.pm)  || 60;
  var lab  = lh * lr;
  var base = ingC + gas + nrg;
  var wm   = base * (1 + pm / 100);
  var price = wm + lab;
  var srv  = parseFloat(r.srv) || 1;
  return {ingC:ingC, gas:gas, nrg:nrg, lab:lab, base:base, wm:wm, price:price, pps: srv > 0 ? price/srv : price, pm:pm};
}

function doLogin() {
  var u = document.getElementById('lu').value.trim().toLowerCase();

      if (btn) { btn.textContent = 'Entrar'; btn.disabled = false; }

        err.textContent = 'Erro ao conectar ao banco: ' + e;
        err.classList.add('show');
        setTimeout(function(){ err.classList.remove('show'); err.textContent = 'Usuario ou senha incorretos.'; }, 4000);
        return;
      }
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app').style.display = 'flex';
      sessionStorage.setItem('cfx', '1');
      renderPage('home');
    });
  } else {
    err.classList.add('show');
    setTimeout(function() { err.classList.remove('show'); }, 3000);

}

  sessionStorage.removeItem('cfx');

  var s = document.getElementById('sidebar');

function saveOrd() {
  var row = {
    client:  document.getElementById('of-cl').value.trim(),
    phone:   document.getElementById('of-ph').value.trim(),
    product: document.getElementById('of-pr').value.trim(),
    qty:     parseInt(document.getElementById('of-qt').value) || 1,
    price:   parseFloat(document.getElementById('of-px').value) || 0,
    date:    document.getElementById('of-dt').value || null,
    status:  document.getElementById('of-st').value,
    notes:   document.getElementById('of-no').value.trim()
  };
  if (!row.client || !row.product) { alert('Preencha cliente e produto.'); return; }
  cm('m-ord');
  showSpinner('Salvando pedido...');
  if (eOrd) {
    sbUpdate('pedidos', eOrd.id, row, function(e) {
      if (e) { alert('Erro ao salvar: ' + e.message); }
      var upd = Object.assign({id: eOrd.id}, row);
      DB.o = DB.o.map(function(x){ return x.id === eOrd.id ? upd : x; });
      rOrders();
    });
  } else {
    sbInsert('pedidos', row, function(e, data) {
      if (e) { alert('Erro ao salvar: ' + e.message); rOrders(); return; }
      if (data && data.id) DB.o.push(Object.assign({id:data.id}, row));
      rOrders();
    });
  }
}

// ===== CLIENTS =====
var cSrch = '';
var eCli = null;

function rClients() {
  // sort alphabetically by name
  var sorted = DB.c.slice().sort(function(a, b) {
    return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1;
  });
  // filter by search (name or phone)
  var fl = sorted.filter(function(c) {
    return c.name.toLowerCase().indexOf(cSrch.toLowerCase()) >= 0
      || (c.phone||'').indexOf(cSrch) >= 0;
  });

  var listHtml = '';
  if (fl.length === 0) {
    if (DB.c.length === 0) {
      listHtml = '<div class="card empty"><div class="ei">&#128101;</div><h3>Nenhum cliente</h3><p>Adicione clientes para enviar orcamentos.</p></div>';
    } else {
      listHtml = '<div class="card empty"><div class="ei">&#128269;</div><h3>Nenhum resultado</h3><p>Nenhum cliente encontrado para "' + esc(cSrch) + '"</p></div>';
    }
  } else {
    for (var i=0; i<fl.length; i++) {
      var c = fl[i];
      var co = DB.o.filter(function(o) { return o.client === c.name; });
      var sp = 0;
      for (var j=0; j<co.length; j++) { if (co[j].status==='entregue') sp += (parseFloat(co[j].price)||0)*(parseInt(co[j].qty)||1); }
      var deliv = co.filter(function(o) { return o.status==='entregue'; }).length;
      var bd = c.bday ? new Date(c.bday + 'T12:00:00') : null;
      var bm = bd && bd.getMonth() === new Date().getMonth();

      // highlight search term in name
      var displayName = esc(c.name);
      if (cSrch) {
        var hIdx = c.name.toLowerCase().indexOf(cSrch.toLowerCase());
        if (hIdx >= 0) {
          displayName = esc(c.name.substring(0, hIdx))
            + '<mark style="background:#fce7f3;color:#9b1b5a;border-radius:3px;padding:0 2px">'
            + esc(c.name.substring(hIdx, hIdx + cSrch.length))
            + '</mark>'
            + esc(c.name.substring(hIdx + cSrch.length));
        }
      }

      var tagsHtml = '';
      var ctags = c.tags || [];
      for (var j=0; j<ctags.length; j++) tagsHtml += '<span class="tchip">' + esc(ctags[j]) + '</span>';
      var waLink = '';
      if (c.phone) waLink = '<a href="https://wa.me/55' + numsOnly(c.phone) + '" target="_blank" class="btn bsm bsuc">WhatsApp</a>';
      listHtml += '<div class="lc"><div class="lch">'
        + '<div class="av">' + esc(c.name).charAt(0).toUpperCase() + '</div>'
        + '<div style="flex:1;min-width:0">'
        + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        + '<strong style="font-size:15px">' + displayName + '</strong>'
        + (bm ? '<span class="badge bwn">Aniversario!</span>' : '')
        + tagsHtml + '</div>'
        + (c.phone ? '<div style="font-size:12.5px;color:var(--tx3);margin-top:3px">' + esc(c.phone) + '</div>' : '')
        + (c.addr  ? '<div style="font-size:12.5px;color:var(--tx3)">' + esc(c.addr) + '</div>' : '')
        + (c.notes ? '<div style="font-size:12px;color:var(--tx4);margin-top:4px;font-style:italic">"' + esc(c.notes) + '"</div>' : '')
        + '</div>'
        + '<div style="display:flex;flex-direction:column;gap:5px">'
        + '<button class="btn bsm bgh bic" onclick="openCli(' + c.id + ')">Editar</button>'
        + '<button class="btn bsm bdn bic" onclick="delCli(' + c.id + ')">Excluir</button>'
        + '</div></div>'
        + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 0">'
        + '<div class="rss"><div class="rsl">Pedidos</div><div class="rsv" style="color:var(--tx)">' + co.length + '</div></div>'
        + '<div class="rss"><div class="rsl">Entregues</div><div class="rsv" style="color:var(--tx)">' + deliv + '</div></div>'
        + '<div class="rss"><div class="rsl">Total gasto</div><div class="rsv" style="color:var(--tx)">' + fmt(sp) + '</div></div>'
        + '</div><div class="lca">'
        + '<button class="btn bsm bpr" onclick="openQte(' + c.id + ')">Enviar Orcamento</button>'
        + waLink + '</div></div>';
    }
  }

  document.getElementById('pg-clients').innerHTML =
    '<div class="ph">'
    + '<div><h2>Clientes</h2><p>' + DB.c.length + ' clientes cadastrados' + (fl.length !== DB.c.length ? ' &bull; ' + fl.length + ' encontrados' : '') + '</p></div>'
    + '<button class="btn bpr" onclick="openCli(null)">+ Novo Cliente</button>'
    + '</div>'
    + '<div class="pc">'
    + '<div class="sb" style="margin-bottom:20px">'
    + '<svg class="si" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>'
    + '<input class="fi" id="cli-srch" value="' + esc(cSrch) + '" placeholder="Buscar cliente por nome ou telefone..." oninput="cSrch=this.value;rClients()" style="padding-left:38px"/>'
    + '</div>'
    + listHtml
    + '</div>';
}

function delCli(id) {
  if (!confirm('Excluir cliente?')) return;
  showSpinner('Excluindo...');
  sbDelete('clientes', id, function(e) {
    if (e) alert('Erro: ' + e.message);
    else DB.c = DB.c.filter(function(c){ return c.id !== id; });
    rClients();
  });
}

function openCli(id) {
  eCli = id ? (DB.c.filter(function(c) { return c.id === id; })[0] || null) : null;
  document.getElementById('cli-t').textContent = id ? 'Editar Cliente' : 'Novo Cliente';
  var c = eCli || {};
  var tagsHtml = '';
  for (var i=0; i<TAGS.length; i++) {
    var active = (c.tags || []).indexOf(TAGS[i]) >= 0 ? ' active' : '';
    tagsHtml += '<button type="button" class="pill' + active + '" onclick="this.classList.toggle(\'active\')" data-tag="' + TAGS[i] + '">' + TAGS[i] + '</button>';
  }
  document.getElementById('cli-b').innerHTML =
    '<div class="fgrid fg2">'
    + '<div class="fg cs2"><label class="fl">Nome completo</label><input class="fi" id="cf-nm" value="' + esc(c.name||'') + '" placeholder="Ex: Ana Paula Santos"/></div>'
    + '<div class="fg"><label class="fl">WhatsApp</label><input class="fi" id="cf-ph" value="' + esc(c.phone||'') + '" placeholder="11999990000"/></div>'
    + '<div class="fg"><label class="fl">E-mail</label><input class="fi" id="cf-em" type="email" value="' + esc(c.email||'') + '" placeholder="email@exemplo.com"/></div>'
    + '<div class="fg"><label class="fl">Aniversario</label><input class="fi" id="cf-bd" type="date" value="' + (c.bday||'') + '"/></div>'
    + '<div class="fg"><label class="fl">Endereco / Bairro</label><input class="fi" id="cf-ad" value="' + esc(c.addr||'') + '" placeholder="Ex: Vila Madalena, SP"/></div>'
    + '<div class="fg cs2"><label class="fl">Observacoes</label><textarea class="fi" id="cf-no" rows="2" placeholder="Preferencias, alergias...">' + esc(c.notes||'') + '</textarea></div>'
    + '</div>'
    + '<div class="fg"><label class="fl">Categorias</label>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">' + tagsHtml + '</div></div>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end">'
    + '<button class="btn bgh" onclick="cm(\'m-cli\')">Cancelar</button>'
    + '<button class="btn bpr" onclick="saveCli()">Salvar Cliente</button>'
    + '</div>';
  om('m-cli');
}

function saveCli() {
  var tagEls = document.querySelectorAll('#cli-b .pill.active');
  var tags = [];
  for (var i=0; i<tagEls.length; i++) tags.push(tagEls[i].getAttribute('data-tag'));
  var row = {
    name:  document.getElementById('cf-nm').value.trim(),
    phone: document.getElementById('cf-ph').value.trim(),
    email: document.getElementById('cf-em').value.trim(),
    bday:  document.getElementById('cf-bd').value || null,
    addr:  document.getElementById('cf-ad').value.trim(),
    notes: document.getElementById('cf-no').value.trim(),
    tags:  tags
  };
  if (!row.name) { alert('Informe o nome.'); return; }
  cm('m-cli');
  showSpinner('Salvando cliente...');
  if (eCli) {
    sbUpdate('clientes', eCli.id, row, function(e) {
      if (e) alert('Erro: ' + e.message);
      var upd = Object.assign({id: eCli.id}, row);
      DB.c = DB.c.map(function(x){ return x.id === eCli.id ? upd : x; });
      rClients();
    });
  } else {
    sbInsert('clientes', row, function(e, data) {
      if (e) { alert('Erro: ' + e.message); rClients(); return; }
      if (data && data.id) DB.c.push(Object.assign({id:data.id}, row));
      rClients();
    });
  }
}

// ===== QUOTE =====
var qItems = [];
var qCliId = null;

function openQte(cid) {
  qCliId = cid;
  qItems = [{rid:'', qty:1, px:''}];
  rQte();
  om('m-qte');
}

function rQte() {
  var cl = null;
  for (var i=0; i<DB.c.length; i++) { if (DB.c[i].id === qCliId) { cl = DB.c[i]; break; } }
  cl = cl || {};

  var rOpts = '<option value="">Selecione...</option>';
  for (var i=0; i<DB.r.length; i++) rOpts += '<option value="' + DB.r[i].id + '">' + esc(DB.r[i].name) + '</option>';

  var tot = 0;
  for (var i=0; i<qItems.length; i++) {
    var item = qItems[i];
    var r = null;
    if (item.rid) { for (var j=0; j<DB.r.length; j++) { if (DB.r[j].id === parseInt(item.rid)) { r = DB.r[j]; break; } } }
    var px = item.px ? parseFloat(item.px) : (r ? calcR(r).price : 0);
    tot += px * (parseInt(item.qty)||1);
  }

  var itemsHtml = '';
  for (var i=0; i<qItems.length; i++) {
    var item = qItems[i];
    var r = null;
    if (item.rid) { for (var j=0; j<DB.r.length; j++) { if (DB.r[j].id === parseInt(item.rid)) { r = DB.r[j]; break; } } }
    var auto = r ? calcR(r).price : 0;
    var selOpts = rOpts.replace('value="' + item.rid + '"', 'value="' + item.rid + '" selected');
    var autoInfo = (r && !item.px) ? '<div style="font-size:11.5px;color:var(--tx3);margin-top:6px">Preco automatico - Subtotal: <strong style="color:var(--pr)">' + fmt(auto * (parseInt(item.qty)||1)) + '</strong></div>' : '';
    var idx = i;
    itemsHtml += '<div class="qi"><div class="qig">'
      + '<div class="fg"><label class="fl" style="font-size:9px">Produto</label><select class="fi" onchange="qItems[' + idx + '].rid=this.value;rQte()">' + selOpts + '</select></div>'
      + '<div class="fg"><label class="fl" style="font-size:9px">Qtd</label><input class="fi" type="number" min="1" value="' + (item.qty||1) + '" onchange="qItems[' + idx + '].qty=this.value;rQte()"/></div>'
      + '<div class="fg"><label class="fl" style="font-size:9px">Preco unit.</label><input class="fi" type="number" step="0.01" value="' + (item.px || (r ? auto.toFixed(2) : '')) + '" placeholder="0,00" oninput="qItems[' + idx + '].px=this.value;rQte()"/></div>'
      + '<div style="display:flex;align-items:flex-end"><button class="btn bsm bdn bic" onclick="qItems.splice(' + idx + ',1);if(!qItems.length)qItems.push({rid:\'\',qty:1,px:\'\'});rQte()">X</button></div>'
      + '</div>' + autoInfo + '</div>';
  }

  document.getElementById('qte-b').innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:4px">'
    + '<div class="av">' + esc(cl.name||'?').charAt(0).toUpperCase() + '</div>'
    + '<div><strong style="font-size:15px">' + esc(cl.name||'') + '</strong>'
    + '<div style="font-size:12.5px;color:var(--tx3)">' + esc(cl.phone||'Sem WhatsApp') + '</div></div></div>'
    + '<div><label class="fl" style="margin-bottom:8px">Itens do orcamento</label>'
    + itemsHtml
    + '<button class="btn bgh" style="width:100%;justify-content:center" onclick="qItems.push({rid:\'\',qty:1,px:\'\'});rQte()">+ Adicionar item</button></div>'
    + '<div class="fgrid fg2">'
    + '<div class="fg"><label class="fl">Data de entrega</label><input class="fi" id="qt-dt" type="date"/></div>'
    + '<div style="background:var(--pr);color:#fff;border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center"><div style="font-size:11px;opacity:.8">Total</div><div style="font-size:20px;font-weight:700">' + fmt(tot) + '</div></div>'
    + '</div>'
    + '<div class="fg"><label class="fl">Observacao</label><input class="fi" id="qt-no" placeholder="Ex: Confirme ate 2 dias antes..."/></div>'
    + '<button class="btn bpr" style="width:100%;justify-content:center;padding:13px" onclick="sendQte()">Gerar e abrir WhatsApp</button>';
}

function sendQte() {
  var cl = null;
  for (var i=0; i<DB.c.length; i++) { if (DB.c[i].id === qCliId) { cl = DB.c[i]; break; } }
  cl = cl || {};
  var ph = numsOnly(cl.phone);
  var dtEl = document.getElementById('qt-dt');
  var noEl = document.getElementById('qt-no');
  var ds = '';
  if (dtEl && dtEl.value) {
    var parts = dtEl.value.split('-');
    ds = parts[2] + '/' + parts[1] + '/' + parts[0];
  }
  var no = noEl ? noEl.value : '';
  var tot = 0;
  for (var i=0; i<qItems.length; i++) {
    var item = qItems[i];
    var r = null;
    if (item.rid) { for (var j=0; j<DB.r.length; j++) { if (DB.r[j].id === parseInt(item.rid)) { r = DB.r[j]; break; } } }
    var px = item.px ? parseFloat(item.px) : (r ? calcR(r).price : 0);
    tot += px * (parseInt(item.qty)||1);
  }
  var msg = 'Ola ' + (cl.name||'') + '!\n\nSegue o orcamento que preparei para voce:\n\n';
  for (var i=0; i<qItems.length; i++) {
    var item = qItems[i];
    var r = null;
    if (item.rid) { for (var j=0; j<DB.r.length; j++) { if (DB.r[j].id === parseInt(item.rid)) { r = DB.r[j]; break; } } }
    var px = item.px ? parseFloat(item.px) : (r ? calcR(r).price : 0);
    if (px > 0 || r) {
      msg += '- ' + (r ? r.name : 'Item') + '\n  ' + (item.qty||1) + ' x ' + fmt(px) + ' = ' + fmt(px * (parseInt(item.qty)||1)) + '\n\n';
    }
  }
  msg += '-------------------\nTotal: ' + fmt(tot) + '\n';
  if (ds) msg += 'Entrega: ' + ds + '\n';
  if (no) msg += '\n' + no + '\n';
  msg += '\nFormas de pagamento: Pix, dinheiro ou cartao\n\nQualquer duvida e so chamar!';
  if (!ph) { alert('Cliente sem WhatsApp cadastrado!'); return; }
  window.open('https://wa.me/55' + ph + '?text=' + encodeURIComponent(msg), '_blank');
}

    + '<div><label class="fl" style="margin-bottom:8px">Custos operacionais</label>'
    + '<div class="opgrid">'
    + '<div class="opbox opgas"><div class="oplbl">Gas (R$)</div><input class="fi" id="rf-gs" type="number" step="0.01" value="' + (r.gas||'') + '" placeholder="Ex: 2,50" oninput="updC()"/><div class="ophint">Custo do gas para assar</div></div>'
    + '<div class="opbox openergy"><div class="oplbl">Energia (R$)</div><input class="fi" id="rf-ng" type="number" step="0.01" value="' + (r.nrg||'') + '" placeholder="Ex: 1,80" oninput="updC()"/><div class="ophint">Energia eletrica utilizada</div></div>'
    + '</div></div>'
    + '<div class="fgrid fg3">'
    + '<div class="fg"><label class="fl">Horas trabalhadas</label><input class="fi" id="rf-lh" type="number" step="0.5" value="' + (r.lh||1) + '" oninput="updC()"/></div>'
    + '<div class="fg"><label class="fl">Valor/hora (R$)</label><input class="fi" id="rf-lr" type="number" value="' + (r.lr||20) + '" oninput="updC()"/></div>'
    + '<div class="fg"><label class="fl">Margem de lucro %</label><input class="fi" id="rf-pm" type="number" value="' + (r.pm||60) + '" oninput="updC()"/></div>'
    + '</div>'
    + '<div style="background:var(--bg2);border-radius:14px;padding:18px">'
    + '<div style="font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Como o preco foi calculado</div>'
    + '<div class="fbox" id="rf-fm"></div>'
    + '<div class="cgrid" style="margin-top:12px" id="rf-cg"></div>'
    + '</div>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">'
    + '<button class="btn bgh" onclick="cm(\'m-rec\')">Cancelar</button>'
    + '<button class="btn bpr" onclick="saveRec()">Salvar Receita</button>'
    + '</div>';
  updC();
}

function pvI() {
  var sel = document.getElementById('rf-ni');
  var qty = parseFloat(document.getElementById('rf-nq').value);
  var ing = null;
  if (sel) { for (var i=0; i<DB.i.length; i++) { if (DB.i[i].id === parseInt(sel.value)) { ing = DB.i[i]; break; } } }
  var pv = document.getElementById('rf-pv');
  var ql = document.getElementById('rf-ql');
  if (ing && ql) ql.textContent = 'Quantidade (' + ing.unit + ')';
  if (ing && qty && pv) {
    var cost = (ing.price / ing.qty) * qty;
    document.getElementById('rf-pvt').textContent = qty + ing.unit + ' de ' + ing.name + ' vai custar:';
    document.getElementById('rf-pvv').textContent = fmt(cost);
    pv.style.display = 'flex';
  } else if (pv) pv.style.display = 'none';
}

function addRI() {
  var sel = document.getElementById('rf-ni');
  var iid = parseInt(sel ? sel.value : 0);
  var qty = parseFloat(document.getElementById('rf-nq').value);
  if (!iid || !qty) { alert('Selecione o ingrediente e informe a quantidade.'); return; }
  var found = false;
  for (var i=0; i<rIngItems.length; i++) { if (rIngItems[i].iid === iid) { rIngItems[i].qty = qty; found = true; break; } }
  if (!found) rIngItems.push({iid: iid, qty: qty});
  rRecBody();
}

function gv(id) {
  var el = document.getElementById(id);
  return el ? el.value : '0';
}

function updC() {
  var pm  = parseFloat(gv('rf-pm')) || 60;
  var lh  = parseFloat(gv('rf-lh')) || 0;
  var lr  = parseFloat(gv('rf-lr')) || 0;
  var gas = parseFloat(gv('rf-gs')) || 0;
  var nrg = parseFloat(gv('rf-ng')) || 0;
  var srv = parseFloat(gv('rf-sv')) || 1;
  var ingC = 0;
  for (var i=0; i<rIngItems.length; i++) {
    var ri = rIngItems[i];
    var ing = null;
    for (var j=0; j<DB.i.length; j++) { if (DB.i[j].id === ri.iid) { ing = DB.i[j]; break; } }
    if (ing && ing.qty) ingC += (ing.price / ing.qty) * ri.qty;
  }
  var lab   = lh * lr;
  var base  = ingC + gas + nrg;
  var wm    = base * (1 + pm / 100);
  var price = wm + lab;

  var fm = document.getElementById('rf-fm');
  if (!fm) return;

  var fmTxt = 'Ingredientes ' + fmt(ingC);
  if (gas > 0) fmTxt += ' + Gas ' + fmt(gas);
  if (nrg > 0) fmTxt += ' + Energia ' + fmt(nrg);
  fmTxt += '<br>x margem <strong>' + pm + '%</strong> = ' + fmt(wm);
  fmTxt += '<br>+ Mao de obra ' + fmt(lab);
  fmTxt += '<div class="ftot">= ' + fmt(price) + '</div>';
  fm.innerHTML = fmTxt;

  var cells = [
    ['Ingredientes', ingC, false],
    ['Gas', gas, false],
    ['Energia', nrg, false],
    ['Base c/ lucro', wm, false],
    ['Mao de obra', lab, false],
    ['Preco final', price, true]
  ];
  var cgHtml = '';
  for (var i=0; i<cells.length; i++) {
    cgHtml += '<div class="cc' + (cells[i][2] ? ' hl' : '') + '"><div class="ccl">' + cells[i][0] + '</div><div class="ccv">' + fmt(cells[i][1]) + '</div></div>';
  }
  if (srv > 1) {
    cgHtml += '<div class="cc" style="grid-column:span 3;text-align:center"><div class="ccl">Por unidade/porcao</div><div class="ccv" style="color:var(--pr)">' + fmt(price/srv) + '</div></div>';
  }
  document.getElementById('rf-cg').innerHTML = cgHtml;
}

function saveRec() {
  var nm = document.getElementById('rf-nm').value.trim();
  if (!nm) { alert('Informe o nome da receita.'); return; }
  var row = {
    name: nm,
    cat:  document.getElementById('rf-ct').value,
    srv:  parseFloat(document.getElementById('rf-sv').value) || 10,
    lh:   parseFloat(document.getElementById('rf-lh').value) || 1,
    lr:   parseFloat(document.getElementById('rf-lr').value) || 20,
    pm:   parseFloat(document.getElementById('rf-pm').value) || 60,
    gas:  parseFloat(document.getElementById('rf-gs').value) || 0,
    nrg:  parseFloat(document.getElementById('rf-ng').value) || 0,
    ings: rIngItems
  };
  cm('m-rec');
  showSpinner('Salvando receita...');
  if (eRec) {
    sbUpdate('receitas', eRec.id, row, function(e) {
      if (e) alert('Erro: ' + e.message);
      var upd = Object.assign({id: eRec.id}, row);
      DB.r = DB.r.map(function(x){ return x.id === eRec.id ? upd : x; });
      rRecipes();
    });
  } else {
    sbInsert('receitas', row, function(e, data) {
      if (e) { alert('Erro: ' + e.message); rRecipes(); return; }
      if (data && data.id) DB.r.push(Object.assign({id:data.id}, row));
      rRecipes();
    });
  }
}

// ===== INGREDIENTS =====
var eIng = null;

var iSrch = '';
function rIngredients() {
  // sort alphabetically
  var sorted = DB.i.slice().sort(function(a, b) {
    return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1;
  });
  // filter by search
  var filtered = sorted.filter(function(ing) {
    return ing.name.toLowerCase().indexOf(iSrch.toLowerCase()) >= 0;
  });

  var cardsHtml = '';
  for (var i=0; i<filtered.length; i++) {
    var ing = filtered[i];
    var ppu = ing.price / ing.qty;
    // highlight matching letters
    var displayName = ing.name;
    if (iSrch) {
      var idx2 = ing.name.toLowerCase().indexOf(iSrch.toLowerCase());
      if (idx2 >= 0) {
        displayName = esc(ing.name.substring(0, idx2))
          + '<mark style="background:#fce7f3;color:#9b1b5a;border-radius:3px;padding:0 2px">'
          + esc(ing.name.substring(idx2, idx2 + iSrch.length))
          + '</mark>'
          + esc(ing.name.substring(idx2 + iSrch.length));
      } else {
        displayName = esc(ing.name);
      }
    } else {
      displayName = esc(ing.name);
    }
    cardsHtml += '<div class="card" style="display:flex;flex-direction:column;gap:14px">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start">'
      + '<div>'
      + '<strong style="font-size:15px;font-family:Playfair Display,serif;display:block">' + displayName + '</strong>'
      + '<span style="font-size:12.5px;color:var(--tx3)">' + ing.qty + ing.unit + ' por ' + fmt(ing.price) + '</span>'
      + '</div>'
      + '<div style="display:flex;gap:5px">'
      + '<button class="btn bsm bgh bic" onclick="openIng(' + ing.id + ')">Editar</button>'
      + '<button class="btn bsm bdn bic" onclick="delIng(' + ing.id + ')">Excluir</button>'
      + '</div></div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">'
      + '<div style="text-align:center;background:var(--bg2);border-radius:8px;padding:7px 6px"><div style="font-size:10px;color:var(--tx3);font-weight:700;margin-bottom:2px">1 ' + ing.unit + '</div><div style="font-size:13px;font-weight:700;color:var(--pr)">' + fmt(ppu) + '</div></div>'
      + '<div style="text-align:center;background:var(--bg2);border-radius:8px;padding:7px 6px"><div style="font-size:10px;color:var(--tx3);font-weight:700;margin-bottom:2px">100 ' + ing.unit + '</div><div style="font-size:13px;font-weight:700;color:var(--pr)">' + fmt(ppu*100) + '</div></div>'
      + '<div style="text-align:center;background:var(--bg2);border-radius:8px;padding:7px 6px"><div style="font-size:10px;color:var(--tx3);font-weight:700;margin-bottom:2px">' + ing.qty + ' ' + ing.unit + '</div><div style="font-size:13px;font-weight:700;color:var(--pr)">' + fmt(ing.price) + '</div></div>'
      + '</div></div>';
  }

  var emptyMsg = '';
  if (DB.i.length === 0) {
    emptyMsg = '<div class="card empty"><div class="ei">&#129474;</div><h3>Nenhum ingrediente</h3><p>Cadastre com o preco da embalagem.</p></div>';
  } else if (filtered.length === 0) {
    emptyMsg = '<div class="card empty"><div class="ei">&#128269;</div><h3>Nenhum resultado</h3><p>Nenhum ingrediente encontrado para "' + esc(iSrch) + '"</p></div>';
  }

  document.getElementById('pg-ingredients').innerHTML =
    '<div class="ph">'
    + '<div><h2>Ingredientes</h2><p>' + DB.i.length + ' ingredientes cadastrados</p></div>'
    + '<button class="btn bpr" onclick="openIng(null)">+ Novo Ingrediente</button>'
    + '</div>'
    + '<div class="pc">'
    + '<div class="sb" style="margin-bottom:20px">'
    + '<svg class="si" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>'
    + '<input class="fi" id="ing-srch" value="' + esc(iSrch) + '" placeholder="Buscar ingrediente por nome..." oninput="iSrch=this.value;rIngredients()" style="padding-left:38px"/>'
    + '</div>'
    + emptyMsg
    + (filtered.length > 0 ? '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">' + cardsHtml + '</div>' : '')
    + '</div>';
}

function delIng(id) {
  if (!confirm('Excluir ingrediente?')) return;
  showSpinner('Excluindo...');
  sbDelete('ingredientes', id, function(e) {
    if (e) alert('Erro: ' + e.message);
    else DB.i = DB.i.filter(function(i){ return i.id !== id; });
    rIngredients();
  });
}

function openIng(id) {
  eIng = id ? (DB.i.filter(function(i) { return i.id === id; })[0] || null) : null;
  document.getElementById('ing-t').textContent = id ? 'Editar Ingrediente' : 'Novo Ingrediente';
  var ing = eIng || {};
  var unitOpts = '';
  for (var i=0; i<UNITS.length; i++) unitOpts += '<option' + ((ing.unit||'g')===UNITS[i]?' selected':'') + '>' + UNITS[i] + '</option>';
  document.getElementById('ing-b').innerHTML =
    '<div class="ibox">Cadastre o preco da embalagem completa. Ex: 1kg de farinha = R$ 5,50. O sistema calcula o custo proporcional nas receitas automaticamente.</div>'
    + '<div class="fg"><label class="fl">Nome do ingrediente</label><input class="fi" id="if-nm" value="' + esc(ing.name||'') + '" placeholder="Ex: Farinha de Trigo"/></div>'
    + '<div class="fgrid fg3">'
    + '<div class="fg"><label class="fl">Qtd. da embalagem</label><input class="fi" id="if-qt" type="number" value="' + (ing.qty||'') + '" placeholder="Ex: 1000" oninput="pvIR()"/></div>'
    + '<div class="fg"><label class="fl">Unidade</label><select class="fi" id="if-un" onchange="pvIR()">' + unitOpts + '</select></div>'
    + '<div class="fg"><label class="fl">Preco da embalagem</label><input class="fi" id="if-px" type="number" step="0.01" value="' + (ing.price||'') + '" placeholder="R$ 0,00" oninput="pvIR()"/></div>'
    + '</div>'
    + '<div id="if-pv" style="display:none;background:var(--bg2);border-radius:12px;padding:14px">'
    + '<div style="font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;margin-bottom:10px">Calculo automatico</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px" id="if-pvg"></div>'
    + '</div>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end">'
    + '<button class="btn bgh" onclick="cm(\'m-ing\')">Cancelar</button>'
    + '<button class="btn bpr" onclick="saveIng()">Salvar Ingrediente</button>'
    + '</div>';
  pvIR();
  om('m-ing');
}

function pvIR() {
  var qt = parseFloat(document.getElementById('if-qt').value);
  var px = parseFloat(document.getElementById('if-px').value);
  var un = document.getElementById('if-un') ? document.getElementById('if-un').value : 'g';
  var pv = document.getElementById('if-pv');
  if (qt && px && pv) {
    var ppu = px / qt;
    var g = document.getElementById('if-pvg');
    if (g) g.innerHTML =
      '<div style="text-align:center;background:#fff;border-radius:8px;padding:8px 6px;border:1px solid var(--bd2)"><div style="font-size:10px;color:var(--tx3);font-weight:700;margin-bottom:3px">1 ' + un + '</div><div style="font-size:14px;font-weight:700;color:var(--pr)">' + fmt(ppu) + '</div></div>'
      + '<div style="text-align:center;background:#fff;border-radius:8px;padding:8px 6px;border:1px solid var(--bd2)"><div style="font-size:10px;color:var(--tx3);font-weight:700;margin-bottom:3px">100 ' + un + '</div><div style="font-size:14px;font-weight:700;color:var(--pr)">' + fmt(ppu*100) + '</div></div>'
      + '<div style="text-align:center;background:#fff;border-radius:8px;padding:8px 6px;border:1px solid var(--bd2)"><div style="font-size:10px;color:var(--tx3);font-weight:700;margin-bottom:3px">' + qt + ' ' + un + '</div><div style="font-size:14px;font-weight:700;color:var(--pr)">' + fmt(px) + '</div></div>';
    pv.style.display = 'block';
  } else if (pv) pv.style.display = 'none';
}

function saveIng() {
  var nm = document.getElementById('if-nm').value.trim();
  var qt = parseFloat(document.getElementById('if-qt').value);
  var un = document.getElementById('if-un').value;
  var px = parseFloat(document.getElementById('if-px').value);
  if (!nm || !qt || !px) { alert('Preencha todos os campos.'); return; }
  var row = {name:nm, qty:qt, unit:un, price:px};
  cm('m-ing');
  showSpinner('Salvando ingrediente...');
  if (eIng) {
    sbUpdate('ingredientes', eIng.id, row, function(e) {
      if (e) alert('Erro: ' + e.message);
      var upd = Object.assign({id: eIng.id}, row);
      DB.i = DB.i.map(function(x){ return x.id === eIng.id ? upd : x; });
      rIngredients();
    });
  } else {
    sbInsert('ingredientes', row, function(e, data) {
      if (e) { alert('Erro: ' + e.message); rIngredients(); return; }
      if (data && data.id) DB.i.push(Object.assign({id:data.id}, row));
      rIngredients();
    });
  }
}

// ===== INIT =====
if (sessionStorage.getItem('cfx') === '1') {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';
  loadAllData(function() { renderPage('home'); });
}

</script>
